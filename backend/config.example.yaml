# 本地配置模板。生产环境建议使用 OTS_DATABASE_URL 环境变量覆盖。
database:
  url: "mysql+pymysql://root:your-password@localhost:3306/ots_test?charset=utf8mb4"

authentication:
  # 使用至少 32 个字符的随机值；真实 config.yaml 不应提交到仓库。
  secret: "replace-with-a-random-secret-of-at-least-32-characters"
  allowed_origin: "http://localhost:5173"
  cookie_secure: false
